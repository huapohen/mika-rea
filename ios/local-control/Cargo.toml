[package]
name = "mika-local-control"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "mika-pair-export"
path = "src/pair_export.rs"

[dependencies]
idevice = { path = "vendor/idevice", default-features = false, features = ["ring", "tcp", "usbmuxd", "xctest", "installation_proxy", "tunnel_tcp_stack", "remote_pairing"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
plist = "1.8"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
