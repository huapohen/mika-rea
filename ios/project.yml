name: MikaIOS
options:
  bundleIdPrefix: com.huapohen
  deploymentTarget:
    iOS: '16.0'
targets:
  MikaUnitTests:
    deploymentTarget: '17.0'
    type: bundle.unit-test
    platform: iOS
    sources: [MikaUnitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.huapohen.mikaremote.unit-tests
    dependencies:
      - target: MikaIOS
  MikaIOS:
    type: application
    platform: iOS
    sources: [MikaIOS, Shared]
    info:
      path: MikaIOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDisplayName: Mika
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: 允许 Mika 创建你要求的闹钟，在指定时间响铃提醒你。
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.huapohen.mikaremote.agent.*]
        CFBundleURLTypes:
          - CFBundleURLName: com.huapohen.mikaremote
            CFBundleURLSchemes: [mikarea]
        NSLocalNetworkUsageDescription: 连接局域网中的 Mika 安卓设备。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huapohen.mikaremote
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        DEVELOPMENT_TEAM: RQHK3ZN3W7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -L$(PROJECT_DIR)/Native -lmika_local_control -framework Security -framework SystemConfiguration -lresolv"
    dependencies:
      - target: MikaLiveWidget
        embed: true
  MikaLiveWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '16.2'
    sources: [MikaLiveWidget, Shared]
    info:
      path: MikaLiveWidget/Info.plist
      properties:
        CFBundleDisplayName: Mika 胶囊
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huapohen.mikaremote.capsule
        DEVELOPMENT_TEAM: RQHK3ZN3W7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  DeviceControlTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DeviceControlTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huapohen.mikaremote.device-tests
        DEVELOPMENT_TEAM: RQHK3ZN3W7
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MikaIOS
    dependencies:
      - target: MikaIOS
  LocalControlRunner:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LocalControlRunner
      - path: DeviceControlTests/LocalControlServer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huapohen.mikaremote.local-runner
        DEVELOPMENT_TEAM: RQHK3ZN3W7
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MikaIOS
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MIKA_LOCAL_RUNNER"
    dependencies:
      - target: MikaIOS
schemes:
  MikaUnitTests:
    build:
      targets:
        MikaIOS: all
        MikaUnitTests: [test]
    test:
      targets: [MikaUnitTests]
  LocalControl:
    build:
      targets:
        MikaIOS: all
        LocalControlRunner: [test]
    test:
      targets: [LocalControlRunner]
  MikaIOS:
    build:
      targets:
        MikaIOS: all
  DeviceControl:
    build:
      targets:
        MikaIOS: all
        DeviceControlTests: [test]
    test:
      targets: [DeviceControlTests]
